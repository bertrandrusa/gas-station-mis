<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrated modern fuel station at dusk">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#122b4a"/><stop offset=".43" stop-color="#29557d"/><stop offset=".7" stop-color="#6f8b9d"/><stop offset="1" stop-color="#1a3755"/></linearGradient>
 <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4bc96" stop-opacity=".54"/><stop offset="1" stop-color="#e4a675" stop-opacity="0"/></linearGradient>
 <linearGradient id="pavement" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#365570"/><stop offset="1" stop-color="#11283d"/></linearGradient>
 <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f2f6f9"/><stop offset=".7" stop-color="#bdccd9"/><stop offset="1" stop-color="#6c8baa"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b8d3de"/><stop offset="1" stop-color="#426c8c"/></linearGradient>
 <radialGradient id="lamp"><stop stop-color="#fef5d4" stop-opacity=".66"/><stop offset=".38" stop-color="#ffe3a1" stop-opacity=".15"/><stop offset="1" stop-color="#fff2cb" stop-opacity="0"/></radialGradient>
 <linearGradient id="roadline" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b1d7ef" stop-opacity=".28"/><stop offset="1" stop-color="#b1d7ef" stop-opacity="0"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
