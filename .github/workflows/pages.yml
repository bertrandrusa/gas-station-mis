name: Publish public MIS demo

on:
  push:
    branches: [main]
    paths:
      - "frontend-demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript and demo tests
        run: |
          node --check frontend-demo/vendor/lottie.min.js
          node --check frontend-demo/app.js
          node -e "const a=require('./frontend-demo/fuel-pump-lottie.json');if(a.nm!=='Gas_station_Final_Comp'||!a.fr||a.op<=a.ip||!a.assets?.length||!a.layers?.length)process.exit(1)"
          node --test frontend-demo/tests/*.test.js
      - name: Check static assets
        run: |
          test -s frontend-demo/index.html
          test -s frontend-demo/styles.css
          test -s frontend-demo/workspace.css
          test -s frontend-demo/login-portal.css
          test -s frontend-demo/forecourt-scene.svg
          test -s frontend-demo/fonts/pt-root-ui-vf.woff2
          test -s frontend-demo/fonts/OFL.txt
          grep -q 'href="./fonts/pt-root-ui-vf.woff2"' frontend-demo/index.html
          grep -q 'font-family:"PTRootUI"' frontend-demo/login-portal.css
          test -s frontend-demo/fuel-pump-lottie.json
          test -s frontend-demo/vendor/lottie.min.js
          test -s frontend-demo/fuel-pump-original.json
          test -s frontend-demo/vendor/LOTTIE_LICENSE.md
          grep -q 'src="./vendor/lottie.min.js"' frontend-demo/index.html
          grep -q 'loadAnimation' frontend-demo/app.js
          grep -q 'href="./login-portal.css"' frontend-demo/index.html
          grep -q 'loop:true,autoplay:false' frontend-demo/app.js
          grep -q 'instance.play()' frontend-demo/app.js
          ! grep -q 'data-action="pump-demo"' frontend-demo/app.js
          grep -q 'prefers-reduced-motion' frontend-demo/login-portal.css
          grep -q "ADS-inspired" frontend-demo/workspace.css
          grep -q -- "--ds-primary:#2563eb" frontend-demo/workspace.css
          grep -q "UI_ICONS" frontend-demo/app.js
          grep -q 'href="./workspace.css"' frontend-demo/index.html
          grep -q 'src="./app.js"' frontend-demo/index.html
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-demo
      - id: deployment
        uses: actions/deploy-pages@v4
